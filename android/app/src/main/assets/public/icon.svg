<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#042f2e" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background with squircle safe padding for Android & Web -->
  <rect width="512" height="512" rx="128" fill="url(#brandGrad)"/>
  
  <!-- Subtle decorative ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="6"/>
  
  <!-- Main Badge & Piggy / Tag Graphic -->
  <g filter="url(#shadow)">
    <!-- Price Tag / Savings Shield shape -->
    <path d="M 256 100 L 370 170 L 370 310 C 370 380 256 424 256 424 C 256 424 142 380 142 310 L 142 170 Z" fill="#ffffff" />
  </g>
  
  <!-- Inner Economiza Symbol: Price Cut Tag + Brazilian Real Sign R$ / Arrow -->
  <g fill="none" stroke="#0f766e" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <!-- Trend Down / Big Savings Arrow -->
    <path d="M 210 210 L 256 256 L 302 210" />
    <path d="M 256 256 L 256 170" />
  </g>
  
  <!-- Currency symbol badge inside shield -->
  <circle cx="256" cy="330" r="38" fill="#0f766e" />
  <text x="256" y="343" font-family="'Outfit', 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">R$</text>
  
  <!-- Sparkles -->
  <path d="M 350 120 L 356 136 L 372 142 L 356 148 L 350 164 L 344 148 L 328 142 L 344 136 Z" fill="#fef08a" />
</svg>
